<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test HTML with Style</title>
    <style>
      :root {
        --bg-dark: #0f172a;
        --panel: rgba(15, 23, 42, 0.8);
        --accent: #38bdf8;
        --accent-2: #8b5cf6;
        --text: #e2e8f0;
        --muted: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-dark), #1e293b 40%, #0ea5e9);
        color: var(--text);
      }

      .card {
        width: min(90vw, 720px);
        padding: 2.5rem;
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .button-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 0.85rem 1.5rem;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(59, 130, 246, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 26px rgba(59, 130, 246, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Styled HTML Test</h1>
      <p>
        This is a simple HTML page with custom CSS styling. The layout is centered,
        has a glass-like panel, gradient colors, and a polished button.
      </p>
      <div class="button-row">
        <button type="button">Learn More</button>
        <button type="button">Get Started</button>
      </div>
    </div>
  </body>
</html>
